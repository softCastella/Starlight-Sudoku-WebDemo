name: Deploy Flutter web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify web demo harnesses
        run: flutter test --dart-define=WEB_DEMO=true test/web_bgm_contract_test.dart test/web_sfx_contract_test.dart test/web_audio_gate_harness_test.dart test/web_audio_preference_harness_test.dart test/web_demo_progress_session_test.dart test/trial_end_modal_harness_test.dart

      - name: Build web release
        run: flutter build web --release --base-href "/Starlight-Sudoku-WebDemo/" --dart-define=WEB_DEMO=true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
